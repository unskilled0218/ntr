services:
  app:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: ntr
    privileged: true
    stdin_open: true
    tty: true
    network_mode: "host"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DISPLAY: ${DISPLAY}
    working_dir: /home/container/workdir/ntr
    volumes:
      - ../:/home/container/workdir
      - ~/.Xauthority:/home/container/.Xauthority
      - /run/user/1000/at-spi/bus:/run/user/1000/at-spi/bus
      - /container/bus/usb:/container/bus/usb
      - /var/run/docker.sock:/var/run/docker.sock