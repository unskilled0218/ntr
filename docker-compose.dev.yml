services:
  app:
    build:
      context: .
      dockerfile: ./dev.Dockerfile
    container_name: ntr
    privileged: true
    stdin_open: true
    tty: true
    network_mode: "host"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DISPLAY: ${DISPLAY}
    working_dir: /home/container/workdir/ntr
    volumes:
      - ../:/home/container/workdir
      - ~/.Xauthority:/home/container/.Xauthority
      - /run/user/1000/at-spi/bus:/run/user/1000/at-spi/bus
      - /container/bus/usb:/container/bus/usb
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ${HOME}/.ssh
        target: /home/container/.ssh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HOME}/.gitconfig
        target: /home/container/.gitconfig
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HOME}/.config/git/token
        target: /home/container/.config/git/token
        read_only: true
        bind:
          create_host_path: false
